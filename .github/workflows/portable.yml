name: portable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Descargar Java 25 (con JavaFX)
        shell: bash
        working-directory: ${{ runner.temp }}
        run: curl -fsSL -o jdk.zip "https://github.com/bell-sw/Liberica/releases/download/25.0.5.0.3+5/bellsoft-jdk25.0.5.0.3+5-windows-amd64-full.zip"
      - uses: actions/setup-java@v5
        with:
          distribution: 'jdkfile'
          jdkFile: ${{ runner.temp }}/jdk.zip
          java-version: '25.0.5'
          architecture: x64
          cache: 'maven'
      - name: Instalar scoop
        uses: MinoruSekine/setup-scoop@v4
      - name: Instalar gettext
        run: scoop install gettext
      - name: Armar el programa portable
        shell: bash
        run: mvn clean install -DskipTests -Drelease -Dgpg.skip=true -Dmaven.javadoc.skip=true --batch-mode
      - name: Preparar los archivos
        shell: bash
        run: |
          mkdir entrega armar
          cd armar
          7z x ../pdfsam-basic/target/pdfsam-basic-*-windows*.zip > /dev/null
          mv pdfsam-basic-*/pdfsam "PDFsam-Foliar-Indexar"
          M=../pdfsam-tools/pdfsam-foliado/src/main/resources/org/pdfsam/tools/foliado/manual
          mkdir -p "PDFsam-Foliar-Indexar/Manual"
          cp -r $M/* "PDFsam-Foliar-Indexar/Manual/"
          7z a -tzip "../entrega/PDFsam-Foliar-Indexar-portable.zip" "PDFsam-Foliar-Indexar" > /dev/null
          cd ..
          git archive --format=zip -o "entrega/PDFsam-Foliar-Indexar-codigo-fuente.zip" HEAD
          cd armar/PDFsam-Foliar-Indexar && 7z a -tzip "../../entrega/Manual-Foliar-Indexar-Girar.zip" Manual > /dev/null && cd ../..
          ls -la entrega
      - name: Instalar WiX (para el instalador)
        shell: bash
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2 WixToolset.UI.wixext/5.0.2
      - name: Armar el instalador
        shell: bash
        run: |
          jpackage --type exe --app-image "armar/PDFsam-Foliar-Indexar" --dest instalador \
            --name "PDFsam-Foliar-Indexar" --app-version 6.0.11 \
            --description "PDFsam Basic con Foliar, Indexar PDF y Girar" \
            --vendor "PDFsam Foliar Indexar" \
            --icon pdfsam-basic/src/assembly/resources/pdfsam.ico \
            --win-menu --win-menu-group "PDFsam Foliar Indexar" --win-shortcut --win-dir-chooser \
            --win-upgrade-uuid 7b0f6c58-3f1e-4c6a-9a0e-5d2f1b7e9c41
          ls -la instalador
          cp instalador/*.exe "entrega/PDFsam-Foliar-Indexar-instalador.exe"
      - name: Juntar todo en un ZIP
        shell: bash
        run: |
          cd entrega
          7z a -tzip "PDFsam-Foliar-Indexar-TODO.zip" "PDFsam-Foliar-Indexar-portable.zip" "PDFsam-Foliar-Indexar-instalador.exe" "PDFsam-Foliar-Indexar-codigo-fuente.zip" "Manual-Foliar-Indexar-Girar.zip" > /dev/null
          ls -la
      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'portable' }}
          name: PDFsam con Foliar e Indexar (portable para Windows)
          prerelease: false
          files: entrega/*
