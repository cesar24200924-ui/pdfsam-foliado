name: portable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Descargar Java 25 (con JavaFX)
        shell: bash
        working-directory: ${{ runner.temp }}
        run: curl -fsSL -o jdk.zip "https://github.com/bell-sw/Liberica/releases/download/25.0.5.0.3+5/bellsoft-jdk25.0.5.0.3+5-windows-amd64-full.zip"
      - uses: actions/setup-java@v5
        with:
          distribution: 'jdkfile'
          jdkFile: ${{ runner.temp }}/jdk.zip
          java-version: '25.0.5'
          architecture: x64
          cache: 'maven'
      - name: Instalar scoop
        uses: MinoruSekine/setup-scoop@v4
      - name: Instalar gettext
        run: scoop install gettext
      - name: Armar el programa portable
        shell: bash
        run: mvn clean install -DskipTests -Drelease -Dgpg.skip=true -Dmaven.javadoc.skip=true --batch-mode
      - name: Preparar los archivos
        shell: bash
        run: |
          mkdir entrega armar
          cd armar
          7z x ../pdfsam-basic/target/pdfsam-basic-*-windows*.zip > /dev/null
          mv pdfsam-basic-*/pdfsam "PDFsam-Foliar-Indexar"
          cp ../docs/Manual-Foliar-Indexar.html "PDFsam-Foliar-Indexar/"
          7z a -tzip "../entrega/PDFsam-Foliar-Indexar-portable.zip" "PDFsam-Foliar-Indexar" > /dev/null
          cd ..
          git archive --format=zip -o "entrega/PDFsam-Foliar-Indexar-codigo-fuente.zip" HEAD
          cp docs/Manual-Foliar-Indexar.html entrega/
          ls -la entrega
      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'portable' }}
          name: PDFsam con Foliar e Indexar ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          prerelease: false
          files: entrega/*
